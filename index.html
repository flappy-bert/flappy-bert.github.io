<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport", content="width=device-width, initial-scale=1.0">
        <title>Flappy Bert</title>
        <link rel="stylesheet" href="flappybert.css">
        <!-- Firebase SDK (compat mode) -->
        <script src="https://www.gstatic.com/firebasejs/11.9.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore-compat.js"></script>
        <script src="flappybert.js"></script>
    </head>
    <body>
        <div class="container">            
            <!--GAME-->
            <div class="item">
                <canvas id="board"></canvas>  
            </div>
            <!--LEADERBOARD-->
            <div class="item">
                 <div class="table-container">  
                    <h2>Leader Board</h2>        
                        <table id="leaderboard">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Name</th>
                                    <th>Score</th>
                                    <th>Mode</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboard-body">
                                <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>                
                            </tbody>
                        </table>
                </div>
                <h3>Controls</h3>
                 <ul>
                  <li>1: Classic | 2: Bad Luck</li>
                  <li>3: Turbo   | 4: Night</li>
                  <li>5: Giant   | 6: Zen (Coins)</li>
                  <br>
                  <li>Jump = "Spacebar" , "X", "ArrowUp"</li>
                  <li>Reset Game = "R" </li>
                  <li>Back to Menu = "M" </li>
                   <li>Hitbox borders = "B"</li>
                 </ul>
           </div>
    </div>
 </body>
</html>
